name: CI

on:
  push:
  pull_request:

jobs:
  firmware-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate firmware layout
        run: scripts/check_firmware_layout.sh

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        working-directory: firmware
        run: |
          if [ -f /opt/esp/idf/export.sh ]; then
            . /opt/esp/idf/export.sh
          fi
          idf.py --version
          idf.py set-target esp32
          idf.py build
